[package]
name = "mpdecimal"
version = "0.0.0"
edition = "2021"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# The test hooks of mpdecimal-testit (c2rust/test-hooks/README.md): extra
# symbols and fault injection used by the long tests. Never enable it
# outside of these tests.
test-hooks = []
